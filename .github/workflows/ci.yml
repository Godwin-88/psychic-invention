name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests, benches compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (errors only)
        run: cargo clippy --no-default-features --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Tests
        # extension-module off so the test binary links libpython
        run: cargo test --no-default-features
      - name: Benchmarks compile
        run: cargo bench --no-default-features --no-run

  python:
    name: Python ${{ matrix.python }} (wheel + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Build and install the abi3 wheel
        run: |
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Reference engine parity (no Rust)
        # The pure-Python engine must agree with Rust; run its tests with Rust hidden.
        run: |
          pip uninstall -y pricing_engine
          python -c "import pricing_engine_mock as m; assert abs(m.price_call(100,100,1,0.05,0.2)-10.450583572185565)<1e-9"
          pytest app/tests/test_position_engine.py app/tests/test_security.py -q
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: wheel-linux
          path: dist/*.whl

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    name: Frontend (type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pricing-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e WRITE_API_KEYS=ci-write -e ADMIN_API_KEYS=ci-admin pricing-engine:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/ | grep '"engine":"rust"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/blotter/trade \
            -H 'content-type: application/json' \
            -d '{"asset":"X","direction":"long","quantity":1,"entry_price":1}')" = 401
          docker logs api | tail -20
