[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pricing_engine"
version = "0.2.0"
description = "Derivatives pricing engine (Rust core) with a FastAPI analytics and trading API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
# The wheel contains only the compiled `pricing_engine` extension; the API's
# own dependencies are in requirements.txt / the [api] extra.
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "gunicorn>=22",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "cvxpy>=1.4",
    "httpx>=0.26",
    "requests>=2.31",
    "redis>=5.0",
    "structlog>=23.2",
    "cachetools>=5.3",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "yfinance>=0.2.40",
    "neo4j>=5.14",
]

[tool.maturin]
# Build the extension with pyo3's extension-module feature (the Cargo default).
features = ["extension-module"]
module-name = "pricing_engine"
# Do not package the application code into the extension wheel.
include = []

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
    "slow: long-running performance benchmarks",
    "integration: needs external services (Redis, Deriv API, network)",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
