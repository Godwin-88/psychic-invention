[package]
name = "pricing_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]


[dependencies]
pyo3 = { version = "0.17", features = ["extension-module", "macros"] }
statrs = "0.18.0"    # for normal CDF (Gaussian)
numpy = "0.17.2"  
rand = "0.9.1"
rand_distr = "0.5.1"
rayon = { version = "1.10.0"}  # optional for parallel
rustfft = "6.0"
num-complex = "0.4"

[dev-dependencies]
proptest = "1.0"
approx = "0.5"