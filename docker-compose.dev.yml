# Local development databases for Transact
# PostgreSQL + Redis for local testing
# Run: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: transact-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: transact
      POSTGRES_PASSWORD: transact_dev
      POSTGRES_DB: transact
    volumes:
      - transact_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transact -d transact"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transact-redis
    ports:
      - "6379:6379"
    volumes:
      - transact_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transact_pg_data:
  transact_redis_data:
