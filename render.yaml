services:
  # Redis Cache Service
  - type: redis
    name: pricing-engine-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Web API Service
  - type: web
    name: pricing-engine-api
    env: python
    region: oregon
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      # Set in the Render dashboard (secrets): WRITE_API_KEYS, ADMIN_API_KEYS,
      # CORS_ORIGINS, and DATABASE_URL before raising workers above 1.
      - key: WRITE_API_KEYS
        sync: false
      - key: ADMIN_API_KEYS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: pricing-engine-redis
          property: connectionString
      - key: CACHE_TTL_L1
        value: 30
      - key: CACHE_TTL_L2
        value: 300
      - key: CACHE_TTL_L3
        value: 3600
    healthCheckPath: /health
    autoDeploy: true
